{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dns-auditor.fullname" . }}
  labels: {{- include "dns-auditor.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces, services, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dns-auditor.fullname" . }}
  labels: {{- include "dns-auditor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dns-auditor.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dns-auditor.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
