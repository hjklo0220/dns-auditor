apiVersion: v1
kind: Service
metadata:
  name: {{ include "dns-auditor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "dns-auditor.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  selector: {{- include "dns-auditor.selectorLabels" . | nindent 4 }}
  ports:
    - {name: dnstap, port: {{ .Values.service.dnstapPort }}, targetPort: dnstap}
    - {name: http, port: {{ .Values.service.httpPort }}, targetPort: http}
