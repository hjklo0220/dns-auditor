{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dns-auditor.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dns-auditor.labels" . | nindent 4 }}
    {{- with .Values.dashboard.labels }}{{ toYaml . | nindent 4 }}{{ end }}
  {{- with .Values.dashboard.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  dns-auditor-dashboard.json: |-
{{ .Files.Get "files/dns-auditor-dashboard.json" | indent 4 }}
{{- end }}
