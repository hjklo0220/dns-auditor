apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dns-auditor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "dns-auditor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {{- include "dns-auditor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dns-auditor.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "dns-auditor.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: dns-auditor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - -dnstap-addr=:{{ .Values.service.dnstapPort }}
            - -http-addr=:{{ .Values.service.httpPort }}
            - -ttl={{ .Values.config.ttl }}
            - -pod-grace={{ .Values.config.podGrace }}
            - -max-findings={{ .Values.config.maxFindings }}
            - -queue-size={{ .Values.config.queueSize }}
            - -cluster-domain={{ .Values.config.clusterDomain }}
            - -log-level={{ .Values.config.logLevel }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - {name: dnstap, containerPort: {{ .Values.service.dnstapPort }}}
            - {name: http, containerPort: {{ .Values.service.httpPort }}}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
