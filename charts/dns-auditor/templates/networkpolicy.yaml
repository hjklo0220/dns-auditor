{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dns-auditor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "dns-auditor.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "dns-auditor.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from: {{- toYaml .Values.networkPolicy.dnstapFrom | nindent 8 }}
      ports: [{port: {{ .Values.service.dnstapPort }}, protocol: TCP}]
    - from: {{- toYaml .Values.networkPolicy.metricsFrom | nindent 8 }}
      ports: [{port: {{ .Values.service.httpPort }}, protocol: TCP}]
{{- end }}
